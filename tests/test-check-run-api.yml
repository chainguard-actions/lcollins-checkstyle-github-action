name: Test check run API call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Checkstyle XML report
        run: |
          mkdir -p /tmp/checkstyle-reports
          cat > /tmp/checkstyle-reports/checkstyle-result.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <checkstyle version="8.45">
            <file name="/src/main/java/com/example/App.java">
              <error line="10" column="1" severity="error" message="Missing a Javadoc comment." source="com.puppycrawl.tools.checkstyle.checks.javadoc.MissingJavadocMethodCheck"/>
            </file>
          </checkstyle>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/checkstyle-reports/checkstyle-result.xml
          name: Checkstyle
          title: Checkstyle Source Code Analyzer report
          check_run: 'true'

      - name: Assert action ran (check run API or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          CHECK_HREF: ${{ steps.action.outputs.check_href }}
        run: |
          echo "outcome: $OUTCOME"
          echo "violations: $VIOLATIONS"
          echo "conclusion: $CONCLUSION"
          echo "check_href: $CHECK_HREF"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VIOLATIONS" ]; then
              echo "FAIL: action succeeded but violations output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with violations=$VIOLATIONS, conclusion=$CONCLUSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for Check Run API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
